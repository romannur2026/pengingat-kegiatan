<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Pengingat Kegiatan</title>
<style>
  :root{
    --bg:#F4F6F5; --surface:#FFFFFF; --ink:#16232B; --muted:#5C6B73;
    --brand:#0B4F6C; --brand-dark:#083C52; --accent:#F4C542;
    --danger:#D64550; --warn:#E8973B; --soon:#2F8F7C; --far:#7C93A3;
    --line:#E3E8E7; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px;}
  header.top{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-dark) 100%);color:#fff;padding:22px 20px 26px;border-radius:0 0 20px 20px;position:relative;overflow:hidden;}
  header.top::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(244,197,66,0.25) 0%,transparent 70%);pointer-events:none;z-index:1;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 4px;}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .sub{margin:4px 0 0;font-size:13px;color:rgba(255,255,255,0.75);}
  .config-toggle{position:absolute;top:18px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;width:40px;height:40px;border-radius:10px;font-size:16px;cursor:pointer;z-index:5;}
  main{padding:16px;max-width:560px;margin:0 auto;}
  .config-panel{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);display:none;}
  .config-panel.open{display:block;}
  .config-panel label{font-size:12px;color:var(--muted);font-weight:600;}
  .config-panel input{width:100%;margin-top:6px;}
  .config-panel .hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
  input,select,textarea{font-family:inherit;font-size:14.5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;}
  .tabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:3px;margin-bottom:16px;border:1px solid var(--line);overflow-x:auto;}
  .tab-btn{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .tab-btn.active{background:var(--brand);color:#fff;}
  .panel{display:none;}
  .panel.active{display:block;}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .bolt{font-size:30px;display:block;margin-bottom:8px;}
  .card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);margin-bottom:12px;display:flex;overflow:hidden;}
  .rail{width:6px;flex-shrink:0;}
  .rail.far{background:var(--far);}
  .rail.h5,.rail.h3{background:var(--soon);}
  .rail.h1{background:var(--warn);}
  .rail.h0{background:var(--danger);}
  .rail.past{background:var(--line);}
  .card-body{padding:13px 14px;flex:1;min-width:0;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-weight:700;font-size:15px;margin:0;}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap;letter-spacing:.02em;}
  .badge.far{background:var(--far);}
  .badge.h5,.badge.h3{background:var(--soon);}
  .badge.h1{background:var(--warn);}
  .badge.h0{background:var(--danger);}
  .badge.past{background:var(--line);color:var(--muted);}
  .card-meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .card-meta div{display:flex;gap:6px;}
  .card-meta b{color:var(--ink);font-weight:600;}
  .card-actions{margin-top:10px;display:flex;gap:8px;}
  .link-btn{font-size:12px;font-weight:700;border:none;background:none;color:var(--brand);cursor:pointer;padding:0;}
  .link-btn.danger{color:var(--danger);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;}
  .type-toggle button.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:4px;}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px;}
  .dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);cursor:pointer;margin-bottom:14px;}
  .dropzone .bolt{font-size:26px;display:block;margin-bottom:6px;}
  #fileInput{display:none;}
  .preview-img{max-width:100%;border-radius:10px;margin-bottom:12px;border:1px solid var(--line);}
  .status-line{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="top">
  <p class="eyebrow">PENGINGAT · H-5 H-3 H-1 HARI-H</p>
  <h1>Kegiatan &amp; Rapat</h1>
  <p class="sub">Notifikasi otomatis ke WhatsApp pribadi</p>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" data-tab="list">Daftar</button>
    <button class="tab-btn" data-tab="add">Tambah</button>
    <button class="tab-btn" data-tab="scan">Scan Foto</button>
    <button class="tab-btn" data-tab="paste">Tempel Teks</button>
  </div>

  <!-- LIST -->
  <section class="panel active" id="panel-list">
    <div id="listContainer"><div class="empty"><span class="bolt"></span>Memuat kegiatan...</div></div>
  </section>

  <!-- ADD -->
  <section class="panel" id="panel-add">
    <form id="eventForm">
      <div class="field"><label>Judul kegiatan</label><input type="text" id="f-judul" placeholder="Rapat Evaluasi Kinerja Q2" required /></div>
      <div class="field"><label>Kepada / dari siapa</label><input type="text" id="f-kepada" placeholder="Manajer UP3 Selaparang" /></div>
      <div class="row2">
        <div class="field"><label>Tanggal</label><input type="date" id="f-tanggal" required /></div>
        <div class="field"><label>Waktu</label><input type="time" id="f-waktu" /></div>
      </div>
      <div class="field">
        <label>Jenis kegiatan</label>
        <div class="type-toggle">
          <button type="button" class="active" data-type="offline">Offline</button>
          <button type="button" data-type="online">Online</button>
        </div>
      </div>
      <div class="field"><label id="lokasiLabel">Lokasi</label><input type="text" id="f-lokasi" placeholder="Kantor UP3 Selaparang, Mataram" /></div>
      <div class="field"><label>Catatan (opsional)</label><textarea id="f-catatan" rows="2" placeholder="Bawa laporan bulanan"></textarea></div>
      <button type="submit" class="btn-primary" id="submitBtn">Simpan Kegiatan</button>
    </form>
  </section>

  <!-- SCAN FOTO/PDF -->
  <section class="panel" id="panel-scan">
    <div class="dropzone" id="dropzone">
      <span class="bolt"></span>
      <div><strong>Upload undangan</strong></div>
      <div style="font-size:12px;margin-top:4px;">Foto (JPG/PNG), screenshot, atau PDF</div>
    </div>
    <input type="file" id="fileInput" accept="image/*,application/pdf" />
    <div id="scanPreviewArea"></div>
    <div id="scanStatus"></div>
    <div id="scanResultForm" style="display:none;">
      <div class="field"><label>Judul kegiatan</label><input type="text" id="s-judul" /></div>
      <div class="field"><label>Kepada / dari siapa</label><input type="text" id="s-kepada" /></div>
      <div class="row2">
        <div class="field"><label>Tanggal</label><input type="date" id="s-tanggal" /></div>
        <div class="field"><label>Waktu</label><input type="time" id="s-waktu" /></div>
      </div>
      <div class="field">
        <label>Jenis kegiatan</label>
        <div class="type-toggle">
          <button type="button" class="active" data-stype="offline">Offline</button>
          <button type="button" data-stype="online">Online</button>
        </div>
      </div>
      <div class="field"><label id="sLokasiLabel">Lokasi</label><input type="text" id="s-lokasi" /></div>
      <div class="field"><label>Catatan</label><textarea id="s-catatan" rows="2"></textarea></div>
      <button class="btn-primary" id="scanSaveBtn">Simpan Kegiatan Ini</button>
    </div>
  </section>

  <!-- TEMPEL TEKS -->
  <section class="panel" id="panel-paste">
    <div class="field">
      <label>Tempel teks undangan (dari chat WA, email, dll)</label>
      <textarea id="pasteText" rows="7" placeholder="Contoh:&#10;Halo, diundang rapat evaluasi kinerja Q2 pada Kamis 9 Juli 2026 jam 09.00 di Ruang Rapat UP3 Selaparang..."></textarea>
    </div>
    <button class="btn-primary" id="pasteAnalyzeBtn">Baca dengan AI</button>
    <div id="pasteStatus" style="margin-top:12px;"></div>
    <div id="pasteResultForm" style="display:none;margin-top:12px;">
      <div class="field"><label>Judul kegiatan</label><input type="text" id="p-judul" /></div>
      <div class="field"><label>Kepada / dari siapa</label><input type="text" id="p-kepada" /></div>
      <div class="row2">
        <div class="field"><label>Tanggal</label><input type="date" id="p-tanggal" /></div>
        <div class="field"><label>Waktu</label><input type="time" id="p-waktu" /></div>
      </div>
      <div class="field">
        <label>Jenis kegiatan</label>
        <div class="type-toggle">
          <button type="button" class="active" data-ptype="offline">Offline</button>
          <button type="button" data-ptype="online">Online</button>
        </div>
      </div>
      <div class="field"><label id="pLokasiLabel">Lokasi</label><input type="text" id="p-lokasi" /></div>
      <div class="field"><label>Catatan</label><textarea id="p-catatan" rows="2"></textarea></div>
      <button class="btn-primary" id="pasteSaveBtn">Simpan Kegiatan Ini</button>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
// URL Apps Script di-hardcode langsung -- bukan rahasia sensitif (cuma endpoint
// buat baca/tulis Sheet kamu sendiri), jadi aman ditulis di sini biar otomatis
// tanpa perlu diisi manual tiap device. Ganti nilai ini kalau kamu bikin
// "New deployment" baru (URL akan berubah); kalau cuma "New version", tetap sama.
const SELF_URL = 'https://script.google.com/macros/s/AKfycbyr3ZzuamAR3q1kX7o6A1VaovfNGDOo6fJ2H0lyL-3Zw0nUd81OLhL-fyvpbsnZ6tzu/exec';
let EVENTS = [];
let addType = 'offline';
let scanType = 'offline';
let pasteType = 'offline';
let scanFileData = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- backend calls (fetch ke SELF_URL yang disuntik server) ----------
function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(
      'Server tidak merespon (' + label + '). Coba muat ulang halaman.'
    )), ms))
  ]);
}
async function apiList(){
  const p = fetch(SELF_URL + '?action=list').then(async res => {
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Gagal memuat data');
    return json.data;
  });
  return withTimeout(p, 15000, 'memuat daftar');
}
async function apiCreate(data){
  const p = fetch(SELF_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'create', data })
  }).then(res => res.json());
  return withTimeout(p, 15000, 'menyimpan data');
}
async function apiDelete(id){
  const p = fetch(SELF_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'delete', id })
  }).then(res => res.json());
  return withTimeout(p, 15000, 'menghapus data');
}

// ---------- list rendering ----------
function daysDiff(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}
function railClass(diff){
  if(diff < 0) return 'past';
  if(diff === 0) return 'h0';
  if(diff === 1) return 'h1';
  if(diff === 3) return 'h3';
  if(diff === 5) return 'h5';
  return 'far';
}
function badgeText(diff){
  if(diff < 0) return 'Lewat';
  if(diff === 0) return 'HARI INI';
  if(diff === 1) return 'H-1';
  return 'H-' + diff;
}
function formatTanggal(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
}

async function fetchEvents(){
  const container = document.getElementById('listContainer');
  container.innerHTML = '<div class="empty"><span class="bolt"></span>Memuat kegiatan...</div>';
  try{
    EVENTS = await apiList();
    renderList();
  }catch(e){
    container.innerHTML = '<div class="empty"><span class="bolt">[!]</span>'+ (e.message||'Gagal memuat data') +'</div>';
  }
}

function renderList(){
  const container = document.getElementById('listContainer');
  if(!EVENTS.length){
    container.innerHTML = '<div class="empty"><span class="bolt"></span>Belum ada kegiatan. Tambahkan lewat tab Tambah, Scan Foto, atau Tempel Teks.</div>';
    return;
  }
  const sorted = [...EVENTS].sort((a,b)=> new Date(a.tanggal) - new Date(b.tanggal));
  container.innerHTML = sorted.map(ev=>{
    const diff = daysDiff(ev.tanggal);
    const rc = railClass(diff);
    const lokasiLabel = ev.tipe === 'online' ? 'Link' : 'Lokasi';
    return `
    <div class="card">
      <div class="rail ${rc}"></div>
      <div class="card-body">
        <div class="card-top">
          <p class="card-title">${escapeHtml(ev.judul)}</p>
          <span class="badge ${rc}">${badgeText(diff)}</span>
        </div>
        <div class="card-meta">
          ${ev.kepada ? `<div> <b>${escapeHtml(ev.kepada)}</b></div>` : ''}
          <div> ${formatTanggal(ev.tanggal)}${ev.waktu ? ' · ' + ev.waktu : ''}</div>
          ${ev.lokasiLink ? `<div>${ev.tipe==='online'?'':''} ${lokasiLabel}: ${escapeHtml(ev.lokasiLink)}</div>` : ''}
          ${ev.catatan ? `<div> ${escapeHtml(ev.catatan)}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="link-btn danger" onclick="removeEvent('${ev.id}')">Hapus</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function removeEvent(id){
  if(!confirm('Hapus kegiatan ini?')) return;
  try{
    await apiDelete(id);
    showToast('Kegiatan dihapus');
    fetchEvents();
  }catch(e){
    showToast('Gagal menghapus');
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

// ---------- tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
  });
});

// ---------- add form ----------
document.querySelectorAll('.type-toggle button[data-type]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-toggle button[data-type]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    addType = btn.dataset.type;
    document.getElementById('lokasiLabel').textContent = addType === 'online' ? 'Link online' : 'Lokasi';
    document.getElementById('f-lokasi').placeholder = addType === 'online' ? 'https://meet.google.com/...' : 'Kantor UP3 Selaparang, Mataram';
  });
});

document.getElementById('eventForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    const data = {
      judul: document.getElementById('f-judul').value.trim(),
      kepada: document.getElementById('f-kepada').value.trim(),
      tanggal: document.getElementById('f-tanggal').value,
      waktu: document.getElementById('f-waktu').value,
      tipe: addType,
      lokasiLink: document.getElementById('f-lokasi').value.trim(),
      catatan: document.getElementById('f-catatan').value.trim()
    };
    const result = await apiCreate(data);
    if(!result.ok) throw new Error(result.error || 'Gagal menyimpan');
    showToast('Kegiatan tersimpan');
    document.getElementById('eventForm').reset();
    document.querySelector('.tab-btn[data-tab="list"]').click();
    fetchEvents();
  }catch(err){
    showToast(err.message || 'Gagal menyimpan');
  }finally{
    btn.disabled = false; btn.textContent = 'Simpan Kegiatan';
  }
});

// ---------- Gemini extraction (dipakai bareng oleh Scan Foto & Tempel Teks) ----------
const EXTRACT_PROMPT = `Ekstrak informasi kegiatan/rapat dari isi berikut (Bahasa Indonesia).
Balas HANYA dengan JSON valid persis struktur ini, tanpa teks lain, tanpa markdown code fence:
{
  "judul": "judul/nama kegiatan",
  "kepada": "ditujukan kepada siapa/instansi apa (kosongkan jika tidak ada)",
  "tanggal": "format YYYY-MM-DD, asumsikan tahun berjalan jika tidak tertulis",
  "waktu": "format HH:mm 24 jam, kosongkan jika tidak ada",
  "tipe": "online atau offline",
  "lokasiLink": "alamat lokasi jika offline, atau link meeting jika online",
  "catatan": "info tambahan penting seperti dresscode, yang perlu dibawa, dsb (boleh kosong)"
}
Jika suatu field tidak ditemukan, isi dengan string kosong "". Jangan mengarang informasi.`;

async function callGemini(parts){
  const p = fetch(SELF_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'extract', parts })
  }).then(res => res.json());
  const result = await withTimeout(p, 30000, 'membaca dengan AI');
  if(!result.ok) throw new Error(result.error || 'Gagal membaca otomatis');
  return result.data;
}

// ---------- Scan Foto/PDF ----------
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
dropzone.addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', handleFile);

document.querySelectorAll('.type-toggle button[data-stype]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-toggle button[data-stype]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    scanType = btn.dataset.stype;
    document.getElementById('sLokasiLabel').textContent = scanType === 'online' ? 'Link online' : 'Lokasi';
  });
});

function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(',')[1];
    scanFileData = { base64, mediaType: file.type };
    const previewArea = document.getElementById('scanPreviewArea');
    if(file.type === 'application/pdf'){
      previewArea.innerHTML = `<div class="status-line"> File PDF dipilih: ${escapeHtml(file.name)}</div>`;
    } else {
      previewArea.innerHTML = `<img class="preview-img" src="${reader.result}" />`;
    }
    document.getElementById('scanResultForm').style.display = 'none';
    await analyzeInvitation();
  };
  reader.readAsDataURL(file);
}

async function analyzeInvitation(){
  const statusEl = document.getElementById('scanStatus');
  statusEl.innerHTML = '<div class="status-line"><div class="spinner"></div> Membaca undangan dengan AI...</div>';
  try{
    const parsed = await callGemini([
      { text: EXTRACT_PROMPT },
      { inline_data: { mime_type: scanFileData.mediaType, data: scanFileData.base64 } }
    ]);
    fillResultForm('s', parsed);
    scanType = (parsed.tipe === 'online') ? 'online' : 'offline';
    document.querySelectorAll('.type-toggle button[data-stype]').forEach(b=>{
      b.classList.toggle('active', b.dataset.stype === scanType);
    });
    document.getElementById('sLokasiLabel').textContent = scanType === 'online' ? 'Link online' : 'Lokasi';
    statusEl.innerHTML = '<div class="status-line">[OK] Terbaca. Cek &amp; sunting jika perlu, lalu simpan.</div>';
    document.getElementById('scanResultForm').style.display = 'block';
  }catch(err){
    statusEl.innerHTML = '<div class="status-line">[!] ' + (err.message || 'Gagal membaca otomatis') + '. Isi manual di bawah.</div>';
    document.getElementById('scanResultForm').style.display = 'block';
  }
}

function fillResultForm(prefix, parsed){
  document.getElementById(prefix+'-judul').value = parsed.judul || '';
  document.getElementById(prefix+'-kepada').value = parsed.kepada || '';
  document.getElementById(prefix+'-tanggal').value = parsed.tanggal || '';
  document.getElementById(prefix+'-waktu').value = parsed.waktu || '';
  document.getElementById(prefix+'-lokasi').value = parsed.lokasiLink || '';
  document.getElementById(prefix+'-catatan').value = parsed.catatan || '';
}

document.getElementById('scanSaveBtn').addEventListener('click', async ()=>{
  await saveFromForm('s', scanType, document.getElementById('scanSaveBtn'), 'scanResultForm', 'scanPreviewArea', 'scanStatus');
  fileInput.value = '';
});

// ---------- Tempel Teks ----------
document.querySelectorAll('.type-toggle button[data-ptype]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-toggle button[data-ptype]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    pasteType = btn.dataset.ptype;
    document.getElementById('pLokasiLabel').textContent = pasteType === 'online' ? 'Link online' : 'Lokasi';
  });
});

document.getElementById('pasteAnalyzeBtn').addEventListener('click', async ()=>{
  const text = document.getElementById('pasteText').value.trim();
  const statusEl = document.getElementById('pasteStatus');
  if(!text){
    statusEl.innerHTML = '<div class="status-line">Tempel dulu teksnya di atas.</div>';
    return;
  }
  statusEl.innerHTML = '<div class="status-line"><div class="spinner"></div> Membaca teks dengan AI...</div>';
  try{
    const parsed = await callGemini([
      { text: EXTRACT_PROMPT + '\\n\\nTeks:\\n' + text }
    ]);
    fillResultForm('p', parsed);
    pasteType = (parsed.tipe === 'online') ? 'online' : 'offline';
    document.querySelectorAll('.type-toggle button[data-ptype]').forEach(b=>{
      b.classList.toggle('active', b.dataset.ptype === pasteType);
    });
    document.getElementById('pLokasiLabel').textContent = pasteType === 'online' ? 'Link online' : 'Lokasi';
    statusEl.innerHTML = '<div class="status-line">[OK] Terbaca. Cek &amp; sunting jika perlu, lalu simpan.</div>';
    document.getElementById('pasteResultForm').style.display = 'block';
  }catch(err){
    statusEl.innerHTML = '<div class="status-line">[!] ' + (err.message || 'Gagal membaca otomatis') + '. Isi manual di bawah.</div>';
    document.getElementById('pasteResultForm').style.display = 'block';
  }
});

document.getElementById('pasteSaveBtn').addEventListener('click', async ()=>{
  await saveFromForm('p', pasteType, document.getElementById('pasteSaveBtn'), 'pasteResultForm', null, 'pasteStatus');
  document.getElementById('pasteText').value = '';
});

// ---------- simpan generik (dipakai Scan Foto & Tempel Teks) ----------
async function saveFromForm(prefix, tipe, btn, formId, previewAreaId, statusId){
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    const data = {
      judul: document.getElementById(prefix+'-judul').value.trim(),
      kepada: document.getElementById(prefix+'-kepada').value.trim(),
      tanggal: document.getElementById(prefix+'-tanggal').value,
      waktu: document.getElementById(prefix+'-waktu').value,
      tipe: tipe,
      lokasiLink: document.getElementById(prefix+'-lokasi').value.trim(),
      catatan: document.getElementById(prefix+'-catatan').value.trim()
    };
    if(!data.judul || !data.tanggal) throw new Error('Judul dan tanggal wajib diisi');
    const result = await apiCreate(data);
    if(!result.ok) throw new Error(result.error || 'Gagal menyimpan');
    showToast('Kegiatan tersimpan');
    document.getElementById(formId).style.display = 'none';
    if(previewAreaId) document.getElementById(previewAreaId).innerHTML = '';
    document.getElementById(statusId).innerHTML = '';
    document.querySelector('.tab-btn[data-tab="list"]').click();
    fetchEvents();
  }catch(err){
    showToast(err.message || 'Gagal menyimpan');
  }finally{
    btn.disabled = false; btn.textContent = 'Simpan Kegiatan Ini';
  }
}

// ---------- init ----------
(async function init(){
  fetchEvents();
})();
</script>
